name: Nightly Portfolio Rebalancing

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every night at midnight UTC
  workflow_dispatch:

jobs:
  rebalance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy pandas-ta

      - name: Run Portfolio Rebalancing
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          python -c '
          import pandas as pd
          import sqlite3
          from datetime import datetime
          # Simulate rebalance using watchlist signals and optimizer logic
          print("🔄 Nightly rebalance started")
          # Load recent signals and optimize top strategies
          conn = sqlite3.connect("xforge_historical.db")
          signals = pd.read_sql_query("SELECT * FROM watchlist_signals ORDER BY timestamp DESC LIMIT 50", conn)
          print("Loaded", len(signals), "signals")
          # Placeholder: recommend rebalance based on BUY signals
          rebalance_summary = f"Rebalanced portfolio at {datetime.now()}: Prioritized {len(signals[signals["signal"] == "BUY"])} BUY signals."
          print(rebalance_summary)
          # In full integration, call optimizer and log to paper_trades table
          conn.close()
          with open("nightly_rebalance_summary.md", "w") as f:
              f.write(rebalance_summary)
          '

      - name: Commit Rebalance Summary
        run: |
          git config user.name "XForge Bot"
          git config user.email "bot@xforge.ai"
          git add nightly_rebalance_summary.md
          git commit -m "🤖 Nightly rebalance: Updated portfolio based on watchlist signals" || echo "No changes"
          git push

      - uses: peter-evans/create-pull-request@v7
        with:
          title: "🤖 Nightly Portfolio Rebalance"
          body: "Automated rebalancing using Multi-Ticker Watchlist signals and Strategy Optimizer. See summary for details."
          branch: nightly-rebalance-update
          delete-branch: true
